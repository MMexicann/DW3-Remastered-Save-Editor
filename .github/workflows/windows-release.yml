name: Windows build and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64
      - name: Verify version, sources and interfaces
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = python package_release.py --version
          if ($LASTEXITCODE -ne 0) { throw 'Release version validation failed.' }
          if ($env:RELEASE_REF_TYPE -eq 'tag' -and $env:RELEASE_REF_NAME -ne "v$version") {
            throw 'Release tag must match the application version.'
          }
          python package_release.py --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest validation failed.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Public tests failed.' }
          python application.py --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Universal GUI startup failed.' }
      - name: Build and verify the standalone Windows executable
        run: |
          python -m pip install -r build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build dependency installation failed.' }
          python build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
          $version = python package_release.py --version
          $smoke = Start-Process -FilePath "dist/UniversalKoeiTecmoSaveEditor-v$version.exe" -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw 'Packaged GUI startup failed.' }
          python package_release.py --verify-executable
          if ($LASTEXITCODE -ne 0) { throw 'Bundle privacy or metadata validation failed.' }
          python package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Local packaging failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: universal-koei-tecmo-windows
          path: release/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: universal-koei-tecmo-windows
          path: release
      - name: Verify artifact hashes
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish a new versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python package_release.py --version)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Universal Koei Tecmo Save Editor v$version" --notes-file RELEASE_NOTES.md release/*.exe release/*.zip release/SHA256SUMS.txt
